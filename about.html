<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="About Stroooop, an independent guide to Amsterdam’s underground and DIY culture.">
    <link rel="icon" type="image/svg+xml" href="favicon-stroooop.svg">
    <title>About · Stroooop</title>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #f4d0f3;
            --ink-black: #111111;
            --accent-color: #006666;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            background: var(--paper-bg);
            color: var(--ink-black);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11pt;
        }

        main {
            width: min(100%, 720px);
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin: 8px 0 32px;
            padding: 7px 10px;
            border: 1px solid var(--ink-black);
            color: inherit;
            text-decoration: none;
        }

        .back-link:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        a:focus-visible {
            outline: 3px solid var(--accent-color);
            outline-offset: 3px;
        }

        h1 {
            margin: 0 0 20px;
            font-family: 'Newsreader', serif;
            font-size: clamp(2.5rem, 12vw, 4.5rem);
            font-weight: 400;
            line-height: 1;
        }

        p {
            max-width: 62ch;
            margin: 0;
            font-size: clamp(1.05rem, 4vw, 1.35rem);
            line-height: 1.65;
        }

        @media (min-width: 700px) {
            body { padding: 40px; }
        }
    </style>
</head>
<body>
    <main>
        <a class="back-link" href="index.html">← Back to events</a>
        <h1>About Stroooop</h1>
        <p>Stroooop is an independent guide to Amsterdam’s alternative scene. No mainstream filler, no tourist traps. Just a clear, dedicated overview of the city's underground and DIY culture. We filter out the excess so you know exactly where to go.</p>
    </main>
</body>
</html>
