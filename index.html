<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon-stroooop.svg">
    <title>AMSTERDAM AGENDA // UPCOMING EVENTS</title>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&icon_names=location_on,schedule,signpost,event,movie,music_note,nightlife,restaurant,apartment,storefront,podium,palette,theater_comedy,stadium,campaign,search,close,expand_more" />
    <style>
        :root {
            --paper-bg: #f4d0f3;
            --ink-black: #111111;
            --accent-color: #006666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .skip-link {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 1000;
            padding: 10px 14px;
            transform: translateY(-160%);
            background: var(--ink-black);
            color: var(--paper-bg);
        }

        .skip-link:focus {
            transform: translateY(0);
        }

        :focus-visible {
            outline: 3px solid var(--accent-color);
            outline-offset: 3px;
        }

        body {
            background-color: var(--paper-bg);
            color: var(--ink-black);
            font-family: 'Space Grotesk', sans-serif;
            padding: 24px;
            min-height: 100vh;
            font-size: 11pt;
        }

        header {
            border-bottom: 1px solid var(--ink-black);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .magazine-title-logo {
            max-height: 56px;
            width: auto;
            display: block;
        }

        .controls-section {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--paper-bg);
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--ink-black);
            padding-bottom: 20px;
            transition: box-shadow 0.2s ease;
        }

        .controls-top {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: nowrap;
            gap: 15px;
            min-width: 0;
            position: relative;
        }

        .city-buttons {
            display: flex;
            gap: 6px;
            flex: 0 0 auto;
            margin-left: auto;
        }

        .city-btn,
        .about-link,
        .city-toggle,
        .mobile-filter-toggle {
            flex: 0 0 auto;
            padding: 6px 9px;
            border: 1px solid var(--ink-black);
            background: transparent;
            color: var(--ink-black);
            font: inherit;
            font-size: 0.82rem;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .city-toggle,
        .mobile-filter-toggle {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
        }

        .city-btn:hover,
        .city-btn.active,
        .about-link:hover,
        .city-toggle:hover,
        .mobile-filter-toggle:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .about-link { margin-left: auto; }

        .category-control {
            position: relative;
            flex: 0 0 auto;
        }

        .city-control { display: none; }

        .city-toggle,
        .city-menu,
        .search-toggle,
        .search-close {
            display: none;
        }

        .search-control {
            display: flex;
            flex: 0 1 25%;
            min-width: 0;
        }

        .controls-section.is-scrolled {
            box-shadow: 0 6px 12px rgba(17, 17, 17, 0.08);
        }

        .search-box {
            display: block;
            background: transparent;
            border: none;
            border-bottom: 1px dotted var(--ink-black);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.05rem;
            color: var(--ink-black);
            padding: 6px 0;
            width: 100%;
            min-width: 0;
            flex: 1 1 auto;
        }

        .search-box::placeholder { color: rgba(17,17,17,0.7); }

        .filter-buttons {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            z-index: 200;
            min-width: 190px;
            max-height: min(65vh, 480px);
            overflow-y: auto;
            padding: 10px;
            border: 1px solid var(--ink-black);
            background: var(--paper-bg);
            flex-direction: column;
            gap: 5px;
            box-shadow: 4px 4px 0 var(--ink-black);
        }

        .city-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            z-index: 200;
            min-width: 160px;
            padding: 10px;
            border: 1px solid var(--ink-black);
            background: var(--paper-bg);
            flex-direction: column;
            gap: 5px;
            box-shadow: 4px 4px 0 var(--ink-black);
        }

        .city-menu.open {
            display: flex;
        }

        .filter-buttons.open {
            display: flex;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--ink-black);
            padding: 6px 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.1s, color 0.1s, border-color 0.1s;
            display: inline-flex;
            align-items: center;
            width: 100%;
            gap: 5px;
            text-align: left;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        @media (max-width: 768px) {
            header { justify-content: space-between; }
            .controls-top {
                justify-content: flex-start;
                gap: 6px;
            }
            .city-buttons { display: none; }
            .city-toggle,
            .search-toggle { display: inline-flex; }
            .city-control {
                display: block;
                order: 0;
            }
            .category-control { order: 1; }
            .search-control { order: 2; }
            .mobile-filter-toggle,
            .city-toggle {
                padding: 5px 6px;
                font-size: 0.8rem;
                min-height: 38px;
            }
            .city-menu { min-width: 145px; }
            .filter-buttons { min-width: 170px; }
            .search-control {
                display: flex;
                align-items: center;
                margin-left: auto;
            }
            .search-control.open {
                position: absolute;
                inset: 0 0 auto;
                z-index: 210;
                width: 100%;
                min-height: 42px;
                padding: 4px 6px;
                border: 1px solid var(--ink-black);
                background: var(--paper-bg);
                gap: 8px;
            }
            .search-control.open .search-toggle { display: none; }
            .search-control.open .search-box {
                display: block;
                flex: 1 1 auto;
                width: auto;
                min-width: 0;
            }
            .search-control.open .search-close { display: inline-flex; }
            .search-toggle,
            .search-close {
                align-items: center;
                justify-content: center;
                width: 38px;
                height: 38px;
                flex: 0 0 38px;
                padding: 0;
                border: 1px solid var(--ink-black);
                background: transparent;
                color: var(--ink-black);
                cursor: pointer;
            }
            .search-toggle:hover,
            .search-close:hover {
                background: var(--accent-color);
                color: #fff;
            }
            .search-control:not(.open) .search-box,
            .search-control:not(.open) .search-close { display: none; }
            .search-control:not(.open) {
                flex: 0 0 38px;
                width: 38px;
            }
            .search-control.open .search-box { font-size: 1rem; }
        }

        .day-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 32px), transparent 100%);
            mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 32px), transparent 100%);
            padding-bottom: 8px;
            padding-top: 8px;
        }

        .day-chip {
            background: transparent;
            border: 1px solid rgba(17,17,17,0.65);
            padding: 6px 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .day-chip.weekend {
            border-color: rgba(17,17,17,0.65);
            background: rgba(4, 122, 122, 0.08);
        }

        .day-chip:hover, .day-chip.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .day-chip.today {
            border-color: var(--ink-black);
            font-weight: 700;
        }

        .magazine-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .grid-message {
            grid-column: 1 / -1;
            padding: 40px;
            text-align: center;
        }

        @media (max-width: 1024px) { .magazine-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .magazine-grid { grid-template-columns: 1fr; } }

        .article-card {
            border: 1px solid var(--ink-black);
            display: flex;
            flex-direction: column;
            background: var(--paper-bg);
            transition: transform 0.1s ease;
            position: relative;
        }

        .article-image-box {
            width: 100%;
            height: 190px;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--ink-black);
        }

        .article-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            gap: 10px;
        }

        .article-date, .article-location { 
            font-size: 11pt;
            opacity: 1;
            font-weight: normal;
            display: flex; 
            align-items: center; 
            gap: 4px; 
            margin-bottom: 6px; 
        }

        .article-title {
            font-family: 'Newsreader', serif;
            font-size: 1.9rem;
            font-weight: 400;
            line-height: 1.05;
        }

        .article-desc {
            font-size: 0.88rem;
            line-height: 1.45;
            opacity: 1;
            font-weight: normal;
            margin-top: 8px;
        }

        .article-footer {
            border-top: 1px dotted var(--ink-black);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.8rem;
            gap: 8px;
            margin-top: 15px;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .footer-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            justify-content: flex-start;
        }

        .footer-left .article-date, .footer-left .article-location { margin-bottom: 0; line-height: 1; }
        .article-cat { text-transform: uppercase; display: flex; align-items: center; gap: 3px; }

        .footer-tags {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .footer-tag-row {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            justify-content: flex-end;
        }

        .badge {
            font-size: 0.7rem;
            padding: 1px 4px;
            border: 1px solid var(--ink-black);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge.ade, .badge.run { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .badge.free { border-color: var(--accent-color); color: var(--accent-color); }
        .badge.is-new { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .event-link {
            display: block;
            flex: 1;
            padding: 7px 12px;
            border: 1px solid var(--ink-black);
            font-size: 0.78rem;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--ink-black);
            text-align: center;
            letter-spacing: 0.05em;
            transition: background 0.1s;
            background: transparent;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
        }

        .cal-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 33px;
            padding: 7px 0;
            border: 1px solid var(--ink-black);
            text-decoration: none;
            color: var(--ink-black);
            transition: background 0.1s;
            background: transparent;
            cursor: pointer;
        }

        .event-link:hover, .cal-link:hover {
            background: var(--ink-black);
            color: var(--paper-bg);
        }

        .page-info-footer {
            margin-top: 40px;
            border-top: 2px solid var(--ink-black);
            padding: 18px 0 8px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            font-size: 0.9rem;
        }

        .footer-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 16px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .privacy-link {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--ink-black);
            padding: 5px 9px;
            color: inherit;
            text-decoration: none;
        }

        .privacy-link:hover {
            background: var(--ink-black);
            color: var(--paper-bg);
        }

        .article-card.is-run { border-style: dashed; }

        .material-symbols-outlined {
            font-size: 15px;
            vertical-align: -0.12em;
            display: inline-block;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>

    <a class="skip-link" href="#main-content">Skip to events</a>
    <header>
        <img class="magazine-title-logo" src="logo-stroooop-3.svg" alt="stroooop logo">
        <a class="about-link" href="about.html">About</a>
    </header>

    <section class="controls-section" id="controls-section" aria-label="Event search and filters">
        <div class="controls-top">
            <div class="city-control">
                <button class="city-toggle" id="city-toggle" type="button" aria-controls="city-menu" aria-expanded="false">
                    <span id="city-toggle-label">Amsterdam</span><span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
                </button>
                <div class="city-menu" id="city-menu" role="group" aria-label="Select a city"></div>
            </div>
            <div class="category-control">
                <button class="mobile-filter-toggle" id="filter-toggle" type="button" aria-controls="filter-container" aria-expanded="false">Category: All</button>
                <div class="filter-buttons" id="filter-container" role="group" aria-label="Filter by category"></div>
            </div>
            <div class="search-control" id="search-control">
                <label class="visually-hidden" for="search">Search events</label>
                <input type="search" class="search-box" id="search" placeholder="Search events...">
                <button class="search-toggle" id="search-toggle" type="button" aria-label="Open search" aria-expanded="false">
                    <span class="material-symbols-outlined" aria-hidden="true">search</span>
                </button>
                <button class="search-close" id="search-close" type="button" aria-label="Close search">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                </button>
            </div>
            <div class="city-buttons" id="desktop-city-buttons" role="group" aria-label="Select a city">
                <button class="city-btn active" type="button" data-city="Amsterdam" aria-pressed="true">Amsterdam</button>
                <button class="city-btn" type="button" data-city="Utrecht" aria-pressed="false">Utrecht</button>
                <button class="city-btn" type="button" data-city="Den Haag" aria-pressed="false">Den Haag</button>
            </div>
        </div>
        <div class="day-selector" id="day-selector-container" role="group" aria-label="Filter by date"></div>
    </section>

    <main id="main-content" tabindex="-1" aria-labelledby="page-heading">
        <h1 class="visually-hidden" id="page-heading">Upcoming events in Amsterdam</h1>
        <div class="magazine-grid" id="grid"></div>
    </main>

    <footer class="page-info-footer">
        <div class="footer-meta">
            <span id="db-status" role="status" aria-live="polite" aria-atomic="true">DATABASE: LOADING...</span>
            <span id="city-label">UPCOMING EVENTS · AMSTERDAM</span>
            <a class="privacy-link" href="privacy.html">Privacy policy</a>
        </div>
    </footer>

    <script>
        let eventsData = [];
        
        const now = new Date();
        const toDateString = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        const today = toDateString(now);
        const tomorrowDate = new Date(now);
        tomorrowDate.setDate(tomorrowDate.getDate() + 1);
        const tomorrow = toDateString(tomorrowDate);
        const formatDate = (dateString, options = { weekday: 'short', month: 'short', day: 'numeric' }) =>
            new Intl.DateTimeFormat('en', options).format(new Date(`${dateString}T12:00:00`));

        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('search');
        const filterContainer = document.getElementById('filter-container');
        const filterToggle = document.getElementById('filter-toggle');
        const daySelectorContainer = document.getElementById('day-selector-container');
        const dbStatus = document.getElementById('db-status');
        const controlsSection = document.getElementById('controls-section');
        const cityButtons = document.querySelectorAll('.city-btn');
        const cityToggle = document.getElementById('city-toggle');
        const cityMenu = document.getElementById('city-menu');
        const cityToggleLabel = document.getElementById('city-toggle-label');
        const searchControl = document.getElementById('search-control');
        const searchToggle = document.getElementById('search-toggle');
        const searchClose = document.getElementById('search-close');
        const pageHeading = document.getElementById('page-heading');
        const cityLabel = document.getElementById('city-label');

        let activeCategory = null;
        let activeDay = today;
        let searchQuery = '';
        let selectedCity = 'Amsterdam';

        const cities = ['Amsterdam', 'Utrecht', 'Den Haag'];

        function selectCity(city) {
            selectedCity = city;
            document.querySelectorAll('.city-btn').forEach(button => {
                const isSelected = button.dataset.city === city;
                button.classList.toggle('active', isSelected);
                button.setAttribute('aria-pressed', String(isSelected));
            });
            cityToggleLabel.textContent = city;
            pageHeading.textContent = `Upcoming events in ${selectedCity}`;
            cityLabel.textContent = `UPCOMING EVENTS · ${selectedCity.toUpperCase()}`;
            closeCityMenu();
            renderGrid();
        }

        function closeCityMenu() {
            cityMenu.classList.remove('open');
            cityToggle.setAttribute('aria-expanded', 'false');
        }

        cities.forEach(city => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `city-btn ${city === selectedCity ? 'active' : ''}`;
            button.dataset.city = city;
            button.setAttribute('aria-pressed', String(city === selectedCity));
            button.textContent = city;
            button.addEventListener('click', () => {
                selectCity(city);
                cityToggle.focus();
            });
            cityMenu.appendChild(button);
        });

        cityButtons.forEach(button => button.addEventListener('click', () => selectCity(button.dataset.city)));

        cityToggle.addEventListener('click', (event) => {
            event.stopPropagation();
            closeCategoryMenu();
            const isOpen = cityMenu.classList.toggle('open');
            cityToggle.setAttribute('aria-expanded', String(isOpen));
        });

        searchToggle.addEventListener('click', () => {
            closeCategoryMenu();
            closeCityMenu();
            searchControl.classList.add('open');
            searchToggle.setAttribute('aria-expanded', 'true');
            searchInput.focus();
        });

        function closeSearch() {
            searchControl.classList.remove('open');
            searchToggle.setAttribute('aria-expanded', 'false');
            searchInput.value = '';
            searchQuery = '';
            renderGrid();
            searchToggle.focus();
        }

        searchClose.addEventListener('click', closeSearch);

        const categoryConfig = {
            film: { label: 'Film', icon: 'movie' },
            music: { label: 'Music', icon: 'music_note' },
            night: { label: 'Night', icon: 'nightlife' },
            nightlife: { label: 'Nightlife', icon: 'nightlife' },
            food: { label: 'Food', icon: 'restaurant' },
            city: { label: 'City', icon: 'apartment' },
            market: { label: 'Market', icon: 'storefront' },
            lecture: { label: 'Lecture', icon: 'podium' },
            art: { label: 'Art', icon: 'palette' },
            theater: { label: 'Theater', icon: 'theater_comedy' },
            stage: { label: 'Stage', icon: 'stadium' },
            talk: { label: 'Talk', icon: 'campaign' }
        };

        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                controlsSection.classList.add('is-scrolled');
            } else {
                controlsSection.classList.remove('is-scrolled');
            }
        });

        filterToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            closeCityMenu();
            const isOpen = filterContainer.classList.toggle('open');
            filterToggle.setAttribute('aria-expanded', String(isOpen));
        });

        function closeCategoryMenu() {
            filterContainer.classList.remove('open');
            filterToggle.setAttribute('aria-expanded', 'false');
        }

        document.addEventListener('click', (e) => {
            if (!filterContainer.contains(e.target) && e.target !== filterToggle) {
                closeCategoryMenu();
            }
            if (!cityMenu.contains(e.target) && e.target !== cityToggle) closeCityMenu();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && filterContainer.classList.contains('open')) {
                closeCategoryMenu();
                filterToggle.focus();
            }
            if (e.key === 'Escape' && cityMenu.classList.contains('open')) {
                closeCityMenu();
                cityToggle.focus();
            }
            if (e.key === 'Escape' && searchControl.classList.contains('open')) closeSearch();
        });

        function fixUrl(u) {
            if (typeof u !== 'string' || !u.trim()) return null;
            const value = u.trim();
            if (/^[\\/]/.test(value)) return null;

            try {
                const url = new URL(/^[a-z][a-z\d+.-]*:/i.test(value) ? value : `https://${value}`);
                return ['http:', 'https:'].includes(url.protocol) && url.hostname ? url.href : null;
            } catch {
                return null;
            }
        }

        function fixImageUrl(value) {
            if (typeof value !== 'string' || !value.trim()) return null;

            try {
                const url = new URL(value, document.baseURI);
                const imageDirectory = new URL('img/', document.baseURI);
                if (url.origin !== imageDirectory.origin ||
                    !url.pathname.startsWith(imageDirectory.pathname) ||
                    url.search || url.hash) return null;
                return url.href;
            } catch {
                return null;
            }
        }

        function isValidDateString(value) {
            if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            const date = new Date(`${value}T12:00:00`);
            return !Number.isNaN(date.getTime()) && toDateString(date) === value;
        }

        function createIcon(name) {
            const icon = document.createElement('span');
            icon.className = 'material-symbols-outlined';
            icon.setAttribute('aria-hidden', 'true');
            icon.textContent = name;
            return icon;
        }

        async function init() {
            try {
                const response = await fetch('events.json');
                if (!response.ok) throw new Error('Kon events.json niet laden');
                eventsData = await response.json();
                dbStatus.textContent = 'DATABASE: EVENTS.JSON';
            } catch (error) {
                console.error(error);
                dbStatus.textContent = 'DATABASE: ERROR LOADING JSON';
                const errorMessage = document.createElement('p');
                errorMessage.className = 'grid-message';
                errorMessage.textContent = '// FOUT BIJ HET LADEN VAN EVENTS.JSON';
                grid.replaceChildren(errorMessage);
                return;
            }

            renderFilters();
            renderDays();
            renderGrid();

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderGrid();
            });
        }

        function renderFilters() {
            const categories = [...new Set(eventsData.map(e => e.c).filter(category => typeof category === 'string' && category))];
            const activeConfig = activeCategory && Object.hasOwn(categoryConfig, activeCategory)
                ? categoryConfig[activeCategory]
                : null;
            const activeLabel = activeConfig?.label || (activeCategory
                ? activeCategory.charAt(0).toUpperCase() + activeCategory.slice(1)
                : 'All');
            filterToggle.replaceChildren(document.createTextNode(`Category: ${activeLabel} `));
            const dropdownIcon = document.createElement('span');
            dropdownIcon.className = 'material-symbols-outlined';
            dropdownIcon.setAttribute('aria-hidden', 'true');
            dropdownIcon.textContent = 'expand_more';
            filterToggle.appendChild(dropdownIcon);

            const allButton = document.createElement('button');
            allButton.type = 'button';
            allButton.className = `filter-btn ${!activeCategory ? 'active' : ''}`;
            allButton.setAttribute('aria-pressed', String(!activeCategory));
            allButton.textContent = 'All';
            allButton.addEventListener('click', () => {
                activeCategory = null;
                renderFilters();
                renderGrid();
                closeCategoryMenu();
                filterToggle.focus();
            });
            filterContainer.replaceChildren(allButton);
            
            categories.forEach(cat => {
                const config = Object.hasOwn(categoryConfig, cat)
                    ? categoryConfig[cat]
                    : { label: cat.charAt(0).toUpperCase() + cat.slice(1), icon: 'signpost' };
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `filter-btn ${activeCategory === cat ? 'active' : ''}`;
                btn.setAttribute('aria-pressed', String(activeCategory === cat));
                btn.append(createIcon(config.icon), document.createTextNode(` ${config.label}`));
                btn.onclick = () => {
                    activeCategory = activeCategory === cat ? null : cat;
                    renderFilters();
                    renderGrid();
                    closeCategoryMenu();
                    filterToggle.focus();
                };
                filterContainer.appendChild(btn);
            });
        }

        function renderDays() {
            const upcomingDates = [...new Set(eventsData.flatMap(item =>
                Array.isArray(item.days) ? item.days.filter(date => isValidDateString(date) && date >= today) : []
            ))].sort();
            const dates = [...new Set([today, tomorrow, ...upcomingDates])].sort();
            const createDayButton = (date, label, extraClass = '') => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `day-chip ${extraClass} ${activeDay === date ? 'active' : ''}`.trim();
                button.setAttribute('aria-pressed', String(activeDay === date));
                button.dataset.date = date || '';
                button.textContent = label;
                button.addEventListener('click', () => selectDay(date));
                return button;
            };
            const buttons = [createDayButton(null, 'All upcoming')];
            dates.forEach(date => {
                const isToday = date === today;
                const label = isToday ? `Today · ${formatDate(date)}` : date === tomorrow
                    ? `Tomorrow · ${formatDate(date)}`
                    : `${formatDate(date, { weekday: 'short' })} ${formatDate(date, { month: 'short', day: 'numeric' })}`;
                const weekdayIndex = new Date(`${date}T12:00:00`).getDay();
                const extraClass = [
                    isToday ? 'today' : '',
                    weekdayIndex === 0 || weekdayIndex === 6 ? 'weekend' : ''
                ].filter(Boolean).join(' ');
                buttons.push(createDayButton(date, label, extraClass));
            });
            daySelectorContainer.replaceChildren(...buttons);
        }

        function selectDay(day) {
            activeDay = day;
            renderDays();
            renderGrid();
            [...daySelectorContainer.querySelectorAll('.day-chip')]
                .find(button => (button.dataset.date || null) === day)
                ?.focus();
        }

        function renderGrid() {
            grid.replaceChildren();

            if (selectedCity !== 'Amsterdam') {
                const message = document.createElement('p');
                message.className = 'grid-message';
                message.textContent = `Event listings for ${selectedCity} are coming soon.`;
                grid.appendChild(message);
                dbStatus.textContent = `EVENT LISTINGS FOR ${selectedCity.toUpperCase()} COMING SOON`;
                return;
            }

            const allFiltered = eventsData.filter(item => {
                const matchesCat = activeCategory ? item.c === activeCategory : true;
                const q = searchQuery;
                const matchesText = value => typeof value === 'string' && value.toLowerCase().includes(q);
                const matchSearch = !q ||
                    matchesText(item.n) ||
                    matchesText(item.v) ||
                    matchesText(item.note);
                return matchesCat && matchSearch;
            });

            let filtered = [];
            let ongoingItems = [];

            if (activeDay !== null) {
                filtered = allFiltered.filter(item => {
                    if (item.days && Array.isArray(item.days)) {
                        return item.days.includes(activeDay);
                    }
                    return false;
                });

                ongoingItems = allFiltered.filter(item => {
                    if (item.run && item.s && item.e) {
                        return activeDay >= item.s && activeDay <= item.e;
                    }
                    return false;
                });
            } else {
                filtered = allFiltered.filter(item => {
                    if (item.run) return item.e >= today;
                    if (item.days) return item.days.some(d => d >= today);
                    return true;
                });
                ongoingItems = [];
            }

            if (filtered.length === 0 && ongoingItems.length === 0) {
                const emptyMessage = document.createElement('p');
                emptyMessage.className = 'grid-message';
                emptyMessage.textContent = '// NO ENTRIES FOR THIS SELECTION';
                grid.appendChild(emptyMessage);
                dbStatus.textContent = `0 ENTRIES`;
                return;
            }

            const totalShown = filtered.length + ongoingItems.length;
            dbStatus.textContent = activeDay
                ? `${totalShown} ENTRIES FOR ${formatDate(activeDay).toUpperCase()}`
                : `${totalShown} UPCOMING ENTRIES`;

            const renderCard = (item) => {
                const url = fixUrl(item.u);
                const card = document.createElement('article');
                card.className = `article-card${item.run ? ' is-run' : ''}`;

                const eventName = typeof item.n === 'string' && item.n ? item.n : 'Unnamed event';
                const cleanLocation = typeof item.v === 'string' ? item.v.replace('📍', '').trim() : 'Amsterdam';
                const imageUrl = fixImageUrl(item.img);
                const note = typeof item.note === 'string' ? item.note : '';
                const linkLabel = typeof item.ul === 'string' && item.ul ? item.ul : 'Info →';
                const validDays = Array.isArray(item.days) ? item.days.filter(isValidDateString) : [];
                const rawDateText = typeof item.when === 'string' && item.when
                    ? item.when
                    : validDays.length ? validDays.map(date => formatDate(date)).join(', ') : 'Date to be announced';
                const dateText = item.t ? `${item.t} · ${rawDateText}` : rawDateText;
                const category = typeof item.c === 'string' ? item.c : '';
                const catConfig = Object.hasOwn(categoryConfig, category)
                    ? categoryConfig[category]
                    : { label: category ? category.charAt(0).toUpperCase() + category.slice(1) : '', icon: 'signpost' };
                const eventDate = validDays.find(date => date >= today) ||
                    (item.run && isValidDateString(item.s) && item.s >= today ? item.s : today);
                const calendarDate = activeDay && item.days?.includes(activeDay) ? activeDay : eventDate;
                const formattedCalendarDate = calendarDate.replaceAll('-', '');
                const startTime = typeof item.t === 'string' ? item.t.match(/(?:^|\D)([01]\d|2[0-3]):[0-5]\d/) : null;
                const startTimeStr = startTime ? `${startTime[1]}${startTime[0].slice(-2)}00` : '190000';
                const calendarUrl = new URL('https://calendar.google.com/calendar/render');
                calendarUrl.search = new URLSearchParams({
                    action: 'TEMPLATE',
                    text: eventName,
                    dates: `${formattedCalendarDate}T${startTimeStr}/${formattedCalendarDate}T220000`,
                    details: note,
                    location: cleanLocation
                });

                if (imageUrl) {
                    const imageBox = document.createElement('div');
                    imageBox.className = 'article-image-box';
                    const image = document.createElement('img');
                    image.src = imageUrl;
                    image.alt = `Image for event: ${eventName}`;
                    imageBox.appendChild(image);
                    card.appendChild(imageBox);
                }

                const content = document.createElement('div');
                content.className = 'article-content';
                const summary = document.createElement('div');
                const title = document.createElement('h2');
                title.className = 'article-title';
                title.textContent = eventName;
                summary.appendChild(title);
                if (note) {
                    const description = document.createElement('p');
                    description.className = 'article-desc';
                    description.textContent = note.length > 120 ? `${note.slice(0, 118)}…` : note;
                    summary.appendChild(description);
                }

                const details = document.createElement('div');
                const footer = document.createElement('div');
                footer.className = 'article-footer';
                const footerLeft = document.createElement('div');
                footerLeft.className = 'footer-left';
                const location = document.createElement('span');
                location.className = 'article-location';
                location.append(createIcon('location_on'), document.createTextNode(` ${cleanLocation}`));
                const date = document.createElement('span');
                date.className = 'article-date';
                date.append(createIcon('schedule'), document.createTextNode(` ${dateText}`));
                footerLeft.append(location, date);

                const footerRight = document.createElement('div');
                footerRight.className = 'footer-right';
                const categoryLabel = document.createElement('span');
                categoryLabel.className = 'article-cat';
                categoryLabel.append(createIcon(catConfig.icon), document.createTextNode(` ${catConfig.label}`));
                footerRight.appendChild(categoryLabel);

                const plainBadges = Array.isArray(item.tags) ? item.tags.filter(tag => typeof tag === 'string') : [];
                const badges = [
                    ...plainBadges.map(text => ({ className: 'tag', text })),
                    ...(item.free ? [{ className: 'free', text: 'Free' }] : []),
                    ...(item.isNew ? [{ className: 'is-new', text: item.isNew }] : []),
                    ...(item.run ? [{ className: 'run', text: 'Doorlopend' }] : []),
                    ...(item.ade ? [{ className: 'ade', text: 'ADE' }] : [])
                ];
                if (badges.length) {
                    const footerTags = document.createElement('div');
                    footerTags.className = 'footer-tags';
                    badges.forEach(({ className, text }) => {
                        const badge = document.createElement('span');
                        badge.className = `badge ${className}`;
                        badge.textContent = text;
                        footerTags.appendChild(badge);
                    });
                    footerRight.appendChild(footerTags);
                }
                footer.append(footerLeft, footerRight);

                const actions = document.createElement('div');
                actions.className = 'card-actions';
                if (url) {
                    const eventLink = document.createElement('a');
                    eventLink.className = 'event-link';
                    eventLink.href = url;
                    eventLink.target = '_blank';
                    eventLink.rel = 'noopener noreferrer';
                    eventLink.setAttribute('aria-label', `More information about ${eventName}`);
                    eventLink.textContent = linkLabel;
                    actions.appendChild(eventLink);
                }

                const calendarLink = document.createElement('a');
                calendarLink.className = 'cal-link';
                calendarLink.href = calendarUrl.href;
                calendarLink.target = '_blank';
                calendarLink.rel = 'noopener noreferrer';
                calendarLink.setAttribute('aria-label', `Add ${eventName} to Google Calendar`);
                calendarLink.appendChild(createIcon('event'));
                actions.appendChild(calendarLink);

                details.append(footer, actions);
                content.append(summary, details);
                card.appendChild(content);
                grid.appendChild(card);
            };

            filtered.forEach(item => renderCard(item));

            if (activeDay !== null && ongoingItems.length > 0) {
                const divider = document.createElement('div');
                divider.style.gridColumn = '1 / -1';
                divider.style.borderTop = '1px dotted var(--ink-black)';
                divider.style.paddingTop = '18px';
                divider.style.marginTop = '8px';
                divider.style.fontSize = '0.8rem';
                divider.style.letterSpacing = '0.1em';
                divider.style.textTransform = 'uppercase';
                divider.textContent = '— Also ongoing on this date: exhibitions & screenings';
                grid.appendChild(divider);
                ongoingItems.forEach(item => renderCard(item));
            }
        }

        init();
    </script>
</body>
</html>
