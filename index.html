<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMSTERDAM AGENDA</title>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&icon_names=location_on,schedule,signpost,event,movie,music_note,nightlife,restaurant,apartment,storefront,podium,palette,theater_comedy,stadium,campaign" />
    <style>
        :root {
            --paper-bg: #f4d0f3;
            --ink-black: #111111;
            --accent-color: #047a7a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--paper-bg);
            color: var(--ink-black);
            font-family: 'Space Grotesk', sans-serif;
            padding: 24px;
            min-height: 100vh;
            font-size: 11pt;
        }

        header {
            border-bottom: 2px solid var(--ink-black);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .magazine-title {
            font-family: 'Newsreader', serif;
            font-size: clamp(2.4rem, 5.5vw, 4.2rem);
            font-weight: 400;
            letter-spacing: -1px;
            line-height: 1;
            text-transform: uppercase;
        }

        .controls-section {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--paper-bg);
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--ink-black);
            padding-bottom: 20px;
            transition: box-shadow 0.2s ease;
        }

        .controls-section.is-scrolled {
            box-shadow: 0 6px 12px rgba(17, 17, 17, 0.08);
        }

        .controls-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
        }

        .search-box {
            background: transparent;
            border: none;
            border-bottom: 1px dotted var(--ink-black);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.05rem;
            color: var(--ink-black);
            padding: 6px 0;
            width: 280px;
            outline: none;
        }

        .search-box::placeholder { color: rgba(17,17,17,0.4); }

        .mobile-filter-toggle {
            display: none;
            background: transparent;
            border: 1px solid var(--ink-black);
            padding: 6px 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
        }

        .filter-buttons { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--ink-black);
            padding: 6px 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.1s, color 0.1s, border-color 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .mobile-filter-toggle { display: block; }
            .filter-buttons {
                display: none;
                position: absolute;
                top: 100%;
                right: 0;
                background: var(--paper-bg);
                border: 1px solid var(--ink-black);
                padding: 12px;
                flex-direction: column;
                gap: 6px;
                box-shadow: 4px 4px 0px var(--ink-black);
                z-index: 200;
                min-width: 160px;
            }
            .filter-buttons.open {
                display: flex;
            }
            .filter-btn {
                width: 100%;
                text-align: left;
            }
        }

        .day-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            border-top: 1px dotted var(--ink-black);
            padding-top: 14px;
        }

        .day-chip {
            background: transparent;
            border: 1px solid rgba(17,17,17,0.3);
            padding: 6px 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .day-chip.weekend {
            border-color: rgba(17,17,17,0.3);
            background: rgba(4, 122, 122, 0.08);
        }

        .day-chip:hover, .day-chip.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .day-chip.today {
            border-color: var(--ink-black);
            font-weight: 700;
        }

        .magazine-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 1024px) { .magazine-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .magazine-grid { grid-template-columns: 1fr; } }

        .article-card {
            border: 1px solid var(--ink-black);
            display: flex;
            flex-direction: column;
            background: var(--paper-bg);
            transition: transform 0.1s ease;
            position: relative;
        }

        .article-card.has-link { cursor: pointer; }

        .article-image-box {
            width: 100%;
            height: 190px;
            background: var(--accent-color);
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--ink-black);
        }

        .article-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: multiply;
            filter: grayscale(100%) contrast(120%);
            opacity: 0.85;
        }

        .article-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            gap: 10px;
        }

        .article-date, .article-location { 
            font-size: 11pt;
            opacity: 1;
            font-weight: normal;
            display: flex; 
            align-items: center; 
            gap: 4px; 
            margin-bottom: 6px; 
        }

        .article-title {
            font-family: 'Newsreader', serif;
            font-size: 1.9rem;
            font-weight: 400;
            line-height: 1.05;
        }

        .article-desc {
            font-size: 0.88rem;
            line-height: 1.45;
            opacity: 1;
            font-weight: normal;
            margin-top: 8px;
        }

        .article-footer {
            border-top: 1px dotted var(--ink-black);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.8rem;
            gap: 8px;
            margin-top: 15px;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .footer-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            justify-content: flex-start;
        }

        .footer-left .article-date, .footer-left .article-location { margin-bottom: 0; line-height: 1; }
        .article-cat { text-transform: uppercase; opacity: 0.6; display: flex; align-items: center; gap: 3px; }

        .footer-tags {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .footer-tag-row {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            justify-content: flex-end;
        }

        .badge {
            font-size: 0.54rem;
            padding: 1px 4px;
            border: 1px solid var(--ink-black);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge.ade, .badge.run { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .badge.free { border-color: #047a7a; color: #047a7a; }
        .badge.is-new { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .badge.tag { opacity: 0.6; }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .event-link {
            display: block;
            flex: 1;
            padding: 7px 12px;
            border: 1px solid var(--ink-black);
            font-size: 0.78rem;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--ink-black);
            text-align: center;
            letter-spacing: 0.05em;
            transition: background 0.1s;
            background: transparent;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
        }

        .cal-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 33px;
            padding: 7px 0;
            border: 1px solid var(--ink-black);
            text-decoration: none;
            color: var(--ink-black);
            transition: background 0.1s;
            background: transparent;
            cursor: pointer;
        }

        .event-link:hover, .cal-link:hover {
            background: var(--ink-black);
            color: var(--paper-bg);
        }

        .page-info-footer {
            margin-top: 40px;
            border-top: 2px solid var(--ink-black);
            padding-top: 18px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .article-card.is-run {
            border-style: dashed;
            opacity: 0.9;
        }

        .material-symbols-outlined {
            font-size: 15px;
            vertical-align: -0.12em;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="magazine-title">Amsterdam ← Plekjes</h1>
    </header>

    <div class="controls-section" id="controls-section">
        <div class="controls-top">
            <input type="text" class="search-box" id="search" placeholder="Search events...">
            <button class="mobile-filter-toggle" id="filter-toggle">Filters ▾</button>
            <div class="filter-buttons" id="filter-container"></div>
        </div>
        <div class="day-selector" id="day-selector-container"></div>
    </div>

    <main class="magazine-grid" id="grid"></main>

    <div class="page-info-footer">
        <span id="db-status">DATABASE: LOADING...</span>
        <span id="range-label">AMSTERDAM</span>
    </div>

    <script>
        let eventsData = [];
        
        // ---- Dates ---------------------------------------------------------------
        // events.json uses ISO dates: days: ["2026-10-21", ...], run events: s/e: "YYYY-MM-DD".
        // Legacy numeric days (pre-Nov 2026 data) are read as October 2026; e >= 99 = open-ended.
        // "Today" is computed in Amsterdam time. Test another day with ?today=YYYY-MM-DD.
        const TZ = 'Europe/Amsterdam';
        const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
        const LEGACY_MONTH = '2026-10';

        function toISO(d) {
            if (d === null || d === undefined || d === '') return null;
            if (typeof d === 'number') return d >= 99 ? '9999-12-31' : `${LEGACY_MONTH}-${String(d).padStart(2, '0')}`;
            return String(d).slice(0, 10);
        }
        function amsterdamToday() {
            const override = new URLSearchParams(location.search).get('today');
            if (override && /^\d{4}-\d{2}-\d{2}$/.test(override)) return override;
            return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        }
        function parseISO(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
        function addDays(iso, n) { const dt = parseISO(iso); dt.setUTCDate(dt.getUTCDate() + n); return dt.toISOString().slice(0, 10); }
        function dayNum(iso) { return parseISO(iso).getUTCDate(); }
        function monLabel(iso) { return MONTHS[parseISO(iso).getUTCMonth()]; }
        function dowLabel(iso) { return DOW[parseISO(iso).getUTCDay()]; }
        function shortDate(iso) { return `${monLabel(iso)} ${dayNum(iso)}`; }
        function eventDays(item) { return Array.isArray(item.days) ? item.days.map(toISO).filter(Boolean) : []; }
        function runStart(item) { return toISO(item.s) || '0000-01-01'; }
        function runEnd(item) { return toISO(item.e) || '9999-12-31'; }
        function formatDays(list) {
            // ["2026-10-30","2026-10-31","2026-11-01"] -> "Oct 30, 31 · Nov 1"
            const groups = [];
            list.forEach(iso => {
                const key = iso.slice(0, 7);
                const g = groups[groups.length - 1];
                if (g && g.key === key) g.days.push(dayNum(iso));
                else groups.push({ key, mon: monLabel(iso), days: [dayNum(iso)] });
            });
            return groups.map(g => `${g.mon} ${g.days.join(', ')}`).join(' · ');
        }
        function calStamp(dt) { return dt.toISOString().replace(/[-:]/g, '').slice(0, 15); } // YYYYMMDDTHHMMSS
        function lastEventDay() {
            let last = today;
            eventsData.forEach(item => eventDays(item).forEach(d => { if (d > last) last = d; }));
            const cap = addDays(today, 42);
            return last > cap ? cap : last;
        }
        function rangeLabel(from, to) {
            const [y1, y2] = [from.slice(0, 4), to.slice(0, 4)];
            const [m1, m2] = [monLabel(from).toUpperCase(), monLabel(to).toUpperCase()];
            if (from.slice(0, 7) === to.slice(0, 7)) return `${m1} ${y1}`;
            return y1 === y2 ? `${m1}–${m2} ${y1}` : `${m1} ${y1}–${m2} ${y2}`;
        }

        const today = amsterdamToday();
        const tomorrow = addDays(today, 1);

        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('search');
        const filterContainer = document.getElementById('filter-container');
        const filterToggle = document.getElementById('filter-toggle');
        const daySelectorContainer = document.getElementById('day-selector-container');
        const dbStatus = document.getElementById('db-status');
        const controlsSection = document.getElementById('controls-section');

        let activeCategory = null;
        let activeDay = today;
        let searchQuery = '';

        const categoryConfig = {
            film: { label: 'Film', icon: 'movie' },
            music: { label: 'Music', icon: 'music_note' },
            night: { label: 'Night', icon: 'nightlife' },
            nightlife: { label: 'Nightlife', icon: 'nightlife' },
            food: { label: 'Food', icon: 'restaurant' },
            city: { label: 'City', icon: 'apartment' },
            market: { label: 'Market', icon: 'storefront' },
            lecture: { label: 'Lecture', icon: 'podium' },
            art: { label: 'Art', icon: 'palette' },
            theater: { label: 'Theater', icon: 'theater_comedy' },
            stage: { label: 'Stage', icon: 'stadium' },
            talk: { label: 'Talk', icon: 'campaign' }
        };

        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                controlsSection.classList.add('is-scrolled');
            } else {
                controlsSection.classList.remove('is-scrolled');
            }
        });

        filterToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            filterContainer.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!filterContainer.contains(e.target) && e.target !== filterToggle) {
                filterContainer.classList.remove('open');
            }
        });

        function fixUrl(u) {
            if (!u) return null;
            if (u.startsWith('http')) return u;
            return 'https://' + u;
        }

        async function init() {
            try {
                const response = await fetch('events.json');
                if (!response.ok) throw new Error('Kon events.json niet laden');
                eventsData = await response.json();
                dbStatus.textContent = 'DATABASE: EVENTS.JSON';
            } catch (error) {
                console.error(error);
                dbStatus.textContent = 'DATABASE: ERROR LOADING JSON';
                grid.innerHTML = `<div style="grid-column:1/-1;padding:40px;text-align:center;opacity:0.5;">// FOUT BIJ HET LADEN VAN EVENTS.JSON</div>`;
                return;
            }

            renderFilters();
            renderDays();
            renderGrid();

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderGrid();
            });
        }

        function renderFilters() {
            const categories = [...new Set(eventsData.map(e => e.c).filter(Boolean))];
            filterContainer.innerHTML = `<button class="filter-btn ${!activeCategory ? 'active' : ''}" onclick="resetCategory()">All</button>`;
            
            categories.forEach(cat => {
                const config = categoryConfig[cat] || { label: cat.charAt(0).toUpperCase() + cat.slice(1), icon: 'signpost' };
                const btn = document.createElement('button');
                btn.className = `filter-btn ${activeCategory === cat ? 'active' : ''}`;
                btn.innerHTML = `<span class="material-symbols-outlined">${config.icon}</span> ${config.label}`;
                btn.onclick = () => { activeCategory = activeCategory === cat ? null : cat; renderFilters(); renderGrid(); filterContainer.classList.remove('open'); };
                filterContainer.appendChild(btn);
            });
        }

        function renderDays() {
            // Chips run from today to the last event date in events.json (max 6 weeks ahead).
            const last = lastEventDay();

            let html = `
                <button class="day-chip ${activeDay===null?'active':''}" onclick="selectDay(null, this)">All upcoming</button>
                <button class="day-chip today ${activeDay===today?'active':''}" onclick="selectDay('${today}', this)">Today (${shortDate(today)})</button>
                <button class="day-chip ${activeDay===tomorrow?'active':''}" onclick="selectDay('${tomorrow}', this)">Tomorrow (${shortDate(tomorrow)})</button>
            `;

            for (let iso = addDays(tomorrow, 1); iso <= last; iso = addDays(iso, 1)) {
                const dow = dowLabel(iso);
                const isWeekend = (dow === 'Sa' || dow === 'Su');
                const label = dayNum(iso) === 1 ? `${dow} ${dayNum(iso)} ${monLabel(iso)}` : `${dow} ${dayNum(iso)}`;
                html += `<button class="day-chip ${isWeekend ? 'weekend' : ''} ${activeDay===iso?'active':''}" onclick="selectDay('${iso}', this)">${label}</button>`;
            }

            daySelectorContainer.innerHTML = html;

            const label = rangeLabel(today, last);
            document.getElementById('range-label').textContent = `${label} · AMSTERDAM`;
            document.title = `AMSTERDAM AGENDA // ${label}`;
        }

        window.selectDay = function(day, btn) {
            activeDay = day;
            document.querySelectorAll('.day-chip').forEach(el => el.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderGrid();
        }

        window.resetCategory = function() { activeCategory = null; renderFilters(); renderGrid(); filterContainer.classList.remove('open'); }

        function renderGrid() {
            grid.innerHTML = '';

            const allFiltered = eventsData.filter(item => {
                const matchesCat = activeCategory ? item.c === activeCategory : true;
                const q = searchQuery;
                const matchSearch = !q ||
                    (item.n && item.n.toLowerCase().includes(q)) ||
                    (item.v && item.v.toLowerCase().includes(q)) ||
                    (item.note && item.note.toLowerCase().includes(q));
                return matchesCat && matchSearch;
            });

            let filtered, ongoingItems = [];
            if (activeDay !== null) {
                filtered = allFiltered.filter(item => !item.run && eventDays(item).includes(activeDay));
                ongoingItems = allFiltered.filter(item => item.run && activeDay >= runStart(item) && activeDay <= runEnd(item));
            } else {
                filtered = allFiltered.filter(item => {
                    if (item.run) return runEnd(item) >= today;
                    if (item.days) return eventDays(item).some(d => d >= today);
                    return true;
                });
                ongoingItems = [];
            }

            if (filtered.length === 0 && ongoingItems.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1;padding:40px;text-align:center;opacity:0.5;">// NO ENTRIES FOR THIS SELECTION</div>`;
                dbStatus.textContent = `0 ENTRIES`;
                return;
            }

            const totalShown = filtered.length + ongoingItems.length;
            dbStatus.textContent = activeDay ? `${totalShown} ENTRIES FOR ${shortDate(activeDay).toUpperCase()}` : `${totalShown} ENTRIES`;

            const renderCard = (item) => {
                const url = fixUrl(item.u);
                const card = document.createElement('div');
                card.className = `article-card${url ? ' has-link' : ''}${item.run ? ' is-run' : ''}`;

                if (url) card.addEventListener('click', (e) => {
                    if (e.target.tagName === 'A' || e.target.closest('.cal-link')) return;
                    window.open(url, '_blank', 'noopener');
                });

                let cleanLocation = item.v ? item.v.replace('📍', '').trim() : 'Amsterdam';
                let topLocationText = `<span class="material-symbols-outlined">location_on</span> ` + cleanLocation;

                const imageHtml = item.img
                    ? `<div class="article-image-box"><img src="${item.img}" alt="${item.n || ''}"></div>`
                    : '';

                const badges = [];
                const greenBadges = [];
                if (item.free) greenBadges.push(`<span class="badge free">Free</span>`);
                if (item.isNew) greenBadges.push(`<span class="badge is-new">${item.isNew}</span>`);
                if (item.tags) item.tags.forEach(t => badges.push(`<span class="badge tag">${t}</span>`));
                if (item.run) greenBadges.push(`<span class="badge run">Doorlopend</span>`);
                if (item.ade) greenBadges.push(`<span class="badge ade">ADE</span>`);
                
                const footerTagsHtml = badges.length || greenBadges.length
                    ? `<div class="footer-tags">${badges.length ? `<div class="footer-tag-row">${badges.join('')}</div>` : ''}${greenBadges.length ? `<div class="footer-tag-row">${greenBadges.join('')}</div>` : ''}</div>`
                    : '';

                const note = item.note || '';
                const noteDisplay = note.length > 120 ? note.slice(0, 118) + '…' : note;
                const noteHtml = noteDisplay ? `<p class="article-desc">${noteDisplay}</p>` : '';

                const linkLabel = item.ul || 'Info →';
                const linkHtml = url ? `<a class="event-link" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${linkLabel}</a>` : '';

                const allDays = eventDays(item);
                const upcomingDays = allDays.filter(d => d >= today);
                const shownDays = upcomingDays.length ? upcomingDays : allDays;
                let dateText = item.when || (shownDays.length ? formatDays(shownDays) : '');
                if (!dateText && item.run && runEnd(item) < '9999-12-31') dateText = `Until ${shortDate(runEnd(item))}`;
                let rawDateText = [item.t, dateText].filter(Boolean).join(' · ');
                let dateFooterText = `<span class="material-symbols-outlined">schedule</span> ` + rawDateText;

                let catConfig = categoryConfig[item.c] || { label: item.c ? item.c.charAt(0).toUpperCase() + item.c.slice(1) : '', icon: 'signpost' };
                let catFooterText = `<span class="material-symbols-outlined">${catConfig.icon}</span> ${catConfig.label}`;

                // Calendar: the selected day if the event is on it, else the next upcoming date (runs: selected day or today)
                const calDay = (activeDay && (allDays.includes(activeDay) || item.run)) ? activeDay
                    : (upcomingDays[0] || allDays[0] || today);
                const tm = (item.t || '').match(/(\d{1,2}):(\d{2})/);
                const startDt = parseISO(calDay);
                startDt.setUTCHours(tm ? Number(tm[1]) : 19, tm ? Number(tm[2]) : 0);
                const endDt = new Date(startDt.getTime() + 3 * 3600 * 1000);
                let gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(item.n || 'Event')}&dates=${calStamp(startDt)}/${calStamp(endDt)}&ctz=${encodeURIComponent(TZ)}&details=${encodeURIComponent(note)}&location=${encodeURIComponent(cleanLocation)}`;

                // Icon-only calendar button
                const calendarHtml = `<a class="cal-link" href="${gCalUrl}" target="_blank" rel="noopener" title="Add to calendar" onclick="event.stopPropagation()"><span class="material-symbols-outlined">event</span></a>`;

                card.innerHTML = `
                    ${imageHtml}
                    <div class="article-content">
                        <div>
                            <h2 class="article-title">${item.n || 'Unnamed event'}</h2>
                            ${noteHtml}
                        </div>
                        <div>
                            <div class="article-footer">
                                <div class="footer-left">
                                    <span class="article-location">${topLocationText}</span>
                                    <span class="article-date">${dateFooterText}</span>
                                </div>
                                <div class="footer-right">
                                    <span class="article-cat">${catFooterText}</span>
                                    ${footerTagsHtml}
                                </div>
                            </div>
                            <div class="card-actions">
                                ${linkHtml}
                                ${calendarHtml}
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            };

            filtered.forEach(item => renderCard(item));

            if (activeDay !== null && ongoingItems.length > 0) {
                const divider = document.createElement('div');
                divider.style.cssText = 'grid-column:1/-1; border-top:1px dotted var(--ink-black); padding-top:18px; margin-top:8px; font-size:0.8rem; opacity:0.55; letter-spacing:0.1em; text-transform:uppercase;';
                divider.textContent = '— Also on today: exhibitions & screenings';
                grid.appendChild(divider);
                ongoingItems.forEach(item => renderCard(item));
            }
        }

        init();
    </script>
</body>
</html>
